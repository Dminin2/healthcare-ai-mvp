services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # This can also be set in .env, but explicitly specifying it here is recommended because it is important for public deployment.
      - DATABASE_URL=sqlite:////data/healthcare_ai.db
    volumes:
      - app-data:/data
    command: uvicorn app.main:create_app --host 0.0.0.0 --port 8000 --factory

volumes:
  app-data:
